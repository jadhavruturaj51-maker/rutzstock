name: Daily 9:50 F&O scan

# 04:20 UTC = 09:50 IST, Monday to Friday.
# GitHub may start scheduled runs a few minutes late; scanner.py waits for
# the 09:45 candle itself, so small delays are fine.
on:
  schedule:
    - cron: "20 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name "fo-scanner-bot"
          git config user.email "actions@github.com"
          git add docs/results.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scan: $(date -u +%F)"
            git push
          fi
