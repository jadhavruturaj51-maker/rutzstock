name: Daily 9:50 F&O scan

# Start at 04:13 UTC = 09:43 IST, Monday to Friday — deliberately BEFORE
# 09:50. GitHub often starts scheduled runs minutes late; starting early
# absorbs that delay. scanner.py waits for the 09:45 candle itself, so the
# picks are still computed from exactly the 09:50 decision point, and the
# results normally land on the site ~09:52-09:54 IST.
on:
  schedule:
    - cron: "13 4 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        run: python scanner.py

      - name: Commit results
        run: |
          git config user.name "fo-scanner-bot"
          git config user.email "actions@github.com"
          git add docs/results.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "scan: $(date -u +%F)"
            git push
          fi
