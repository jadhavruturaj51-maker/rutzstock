<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutzstock — 9:50 list</title>
<style>
  :root { --bg:#f2f3f5; --card:#ffffff; --line:#e3e6ea; --txt:#111827; --dim:#6b7280;
          --green:#1a7f37; --red:#b42318; --badge:#dcf2e3; --badge-txt:#137333; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 18px 12px 40px; }
  h1 { font-size: 19px; margin: 2px 0 2px; font-weight: 700; }
  .snapshot { color: var(--dim); font-size: 12px; margin-bottom: 16px; }
  h2 { font-size: 15px; margin: 20px 0 8px; font-weight: 700; }
  h2 .who { color: var(--dim); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 12px 14px 6px; margin-bottom: 14px; }
  .card-head { font-size: 13.5px; margin-bottom: 6px; }
  .card-head .status { color: var(--dim); }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--dim); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .05em; padding: 6px 6px 6px 0; }
  td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
  .sym { font-weight: 600; }
  .side-long { color: var(--green); font-weight: 700; }
  .side-short { color: var(--red); font-weight: 700; }
  .levels { white-space: nowrap; }
  .failed { display: block; color: var(--dim); font-size: 12px; white-space: normal; }
  .pick-badge { background: var(--badge); color: var(--badge-txt); font-weight: 700;
                font-size: 11.5px; padding: 2px 10px; border-radius: 20px; }
  .nopick { color: var(--dim); font-size: 12.5px; }
  .scores { display: flex; gap: 12px; flex-wrap: wrap; }
  .score { flex: 1 1 250px; background: var(--card); border: 1px solid var(--line);
           border-radius: 14px; padding: 12px 14px; }
  .score h3 { margin: 0 0 6px; font-size: 14px; }
  .score .row { display: flex; justify-content: space-between; font-size: 13px;
                color: var(--dim); padding: 2px 0; }
  .score .row b { color: var(--txt); }
  .pos { color: var(--green); } .neg { color: var(--red); }
  ul.crit { margin: 4px 0 10px 18px; padding: 0; font-size: 13px; line-height: 1.55; }
  .foot { color: var(--dim); font-size: 12px; line-height: 1.6; margin-top: 10px; }
  .tag { display: inline-block; font-size: 10.5px; border: 1px solid var(--line);
         border-radius: 20px; padding: 0 7px; color: var(--dim); margin-left: 6px; }
  .err { color: var(--red); font-size: 13px; }
  #gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center;
          justify-content: center; padding: 16px; z-index: 10; }
  .gate-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
              padding: 22px 20px; width: 100%; max-width: 320px; text-align: center; }
  .gate-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .gate-sub { color: var(--dim); font-size: 12.5px; margin-bottom: 14px; }
  .gate-box input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid var(--line);
                    border-radius: 8px; margin-bottom: 10px; text-align: center; }
  .gate-box button { width: 100%; padding: 10px; font-size: 15px; font-weight: 700;
                     background: #111827; color: #fff; border: 0; border-radius: 8px; cursor: pointer; }
  .gate-err { color: var(--red); font-size: 12.5px; margin-top: 8px; min-height: 16px; }
  @media (max-width: 560px) { .levels { white-space: normal; } td, th { padding-right: 4px; } }
</style>
</head>
<body>
<div id="gate">
  <div class="gate-box">
    <div class="gate-title">Rutzstock</div>
    <div class="gate-sub">This page is password protected.</div>
    <input id="pw" type="password" inputmode="numeric" placeholder="Password" autocomplete="off">
    <button id="pwbtn">Open</button>
    <div class="gate-err" id="pwerr"></div>
  </div>
</div>
<div class="wrap" id="app" style="display:none">
  <h1>Rutzstock <span style="color:#6b7280;font-size:13.5px;font-weight:600;">— F&amp;O criteria · 9:50 list</span></h1>
  <div class="snapshot" id="snapshot">Loading…</div>

  <div id="scanners"></div>

  <div class="foot"><a href="backtest.html" style="color:#6b7280;">Backtest results →</a></div>
  <div class="foot">own risk, not advice. This scan is for information only; the decisions and the losses are yours. · <a href="#" id="locklink" style="color:#6b7280;">Lock site</a></div>
</div>

<script>
function esc(s) { return String(s); }
function sideHtml(side) {
  return '<span class="' + (side === "LONG" ? "side-long" : "side-short") + '">' + side + "</span>";
}
function fmtMove(v) {
  if (v === null || v === undefined) return "—";
  return (v > 0 ? "+" : "") + Number(v).toFixed(2) + "%";
}
function stockRows(day, rows, isPick) {
  var out = "";
  rows.forEach(function (p) {
    var lv = "entry " + Number(p.entry).toFixed(2) + " · SL " + Number(p.sl).toFixed(2) + " · T1 " + Number(p.t1).toFixed(2);
    if (!isPick && p.failed && p.failed.length) {
      lv += '<span class="failed">failed: ' + p.failed.join(", ") + "</span>";
    }
    out += "<tr><td class='sym'>" + esc(p.symbol) + "</td><td>" + sideHtml(day.side) +
           "</td><td>" + fmtMove(p.move_pct) + "</td><td>" + p.passed + "/12</td>" +
           "<td class='levels'>" + lv + "</td></tr>";
  });
  return out;
}
function stockTable(day, rows, isPick) {
  return "<table><thead><tr><th>Stock</th><th>Side</th><th>Move</th><th>Passed</th><th>Ref levels</th></tr></thead><tbody>" +
         stockRows(day, rows, isPick) + "</tbody></table>";
}
function dayCard(day, key, title) {
  var s = day[key];
  var has = s.picks && s.picks.length;
  var rows = has ? s.picks : (s.near || []);
  var status = has ? "PICK — " + s.picks.length + " stock" + (s.picks.length > 1 ? "s" : "")
                   : "no pick (no stock passed all checks)";
  var html = '<div class="card"><div class="card-head">' + day.date + ' — <span class="status">' + status + "</span>" +
             (day.source === "backtest" ? '<span class="tag">backtest</span>' : '<span class="tag">live</span>') + "</div>";
  if (rows.length) html += stockTable(day, rows, has);
  else html += '<div class="nopick">No stocks to show.</div>';
  return html + "</div>";
}
function loadData() {
fetch("results.json", { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (data) {
    var days = data.days || [];
    document.getElementById("snapshot").textContent =
      "Data snapshot: " + (days.length ? days[0].date : "—") +
      " (refreshed automatically every trading day at 9:50 am IST)" +
      (data.updated_at ? " · Last updated: " + new Date(data.updated_at).toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }) + " IST" : "");
    if (!days.length) {
      document.getElementById("scanners").innerHTML = '<div class="nopick">No scan data yet.</div>';
      return;
    }
    var latest = days[0];
    document.getElementById("scanners").innerHTML =
      "<h2>Scanner A — RJ Scanner</h2>" + dayCard(latest, "rj", "Scanner A — RJ Scanner") +
      "<h2>Scanner B — Muse Scanner</h2>" + dayCard(latest, "claude", "Scanner B — Muse Scanner") +
      "<h2>Scanner C — One-Direction</h2>" + dayCard(latest, "trend", "Scanner C — One-Direction");
  })
  .catch(function () {
    document.getElementById("snapshot").innerHTML = '<span class="err">Could not load results.json yet.</span>';
  });
}
var PW_HASH = "72103e00168c0b76061e54a93ec1bd72629abe364bdbd4eccf7c30495179bcfb";
function sha256hex(text) {
  return crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)).then(function (buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return ("0" + b.toString(16)).slice(-2);
    }).join("");
  });
}
function unlock() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("app").style.display = "block";
  loadData();
}
function tryUnlock() {
  sha256hex(document.getElementById("pw").value).then(function (h) {
    if (h === PW_HASH) {
      try { localStorage.setItem("rutzstock_unlocked", PW_HASH); } catch (e) {}
      unlock();
    } else {
      document.getElementById("pwerr").textContent = "Wrong password — try again.";
    }
  });
}
document.getElementById("pwbtn").addEventListener("click", tryUnlock);
document.getElementById("pw").addEventListener("keydown", function (e) {
  if (e.key === "Enter") tryUnlock();
});
document.getElementById("locklink").addEventListener("click", function (e) {
  e.preventDefault();
  try { localStorage.removeItem("rutzstock_unlocked"); } catch (err) {}
  location.reload();
});
var savedUnlock = null;
try { savedUnlock = localStorage.getItem("rutzstock_unlocked"); } catch (e) {}
if (savedUnlock === PW_HASH) { unlock(); } else { document.getElementById("pw").focus(); }
</script>
</body>
</html>
